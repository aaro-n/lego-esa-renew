name: 续签 SSL 证书上传到阿里云并更新阿里云ESA证书

on:
  push:
    branches:
      - main
  schedule:
    - cron: "24 11 */7 * *"  # 每 7 天触发一次

jobs:
  request-cert:
    runs-on: ubuntu-latest

    steps:
      # 1. 检出代码
      - name: 检出代码
        uses: actions/checkout@v2

      # 2. 安装 Lego
      - name: 安装 Lego
        run: |
          latest_version=$(curl -s https://api.github.com/repos/go-acme/lego/releases/latest | grep '"tag_name"' | sed -E 's/.*"([^"]+)".*/\1/')
          download_url="https://github.com/go-acme/lego/releases/download/${latest_version}/lego_${latest_version}_linux_amd64.tar.gz"
          wget -O lego_linux_amd64.tar.gz "$download_url"
          tar -xzf lego_linux_amd64.tar.gz
          sudo mv lego /usr/local/bin/
          sudo chmod +x /usr/local/bin/lego

      # 3. 使用 Lego 申请/续签 SSL 证书 (支持环境变量 & 标记文件双重强刷并解耦 --force)
      - name: 使用 Lego 申请/续签 SSL 证书
        env:
          DOMAIN: ${{ secrets.DOMAIN }}
          EMAIL: ${{ secrets.EMAIL }}
          ALICLOUD_ACCESS_KEY: ${{ secrets.ALICLOUD_ACCESS_KEY }}
          ALICLOUD_SECRET_KEY: ${{ secrets.ALICLOUD_SECRET_KEY }}
          CERT_PATH: ${{ secrets.CERT_PATH }}
          RENEW_OPTION: ${{ secrets.RENEW_OPTION }}
        run: |
          CERT_PATH="${CERT_PATH:-certs}"  # 默认为 certs
          TRIGGER_RESET="false"

          # 方式 A：判断环境变量是否为强制动作
          if [ "$RENEW_OPTION" == "run" ] || [ "$RENEW_OPTION" == "force-reset" ]; then
            echo "【激活】检测到环境变量强置信号 ($RENEW_OPTION)"
            TRIGGER_RESET="true"
          fi

          # 方式 B：判断 force-reset.txt 文件是否存在且“非空”
          if [ -s "force-reset.txt" ]; then
            echo "【激活】检测到标记文件 force-reset.txt 存在且有内容，触发强制刷新"
            TRIGGER_RESET="true"
          fi
          
          # 执行彻底清空本地旧数据逻辑
          if [ "$TRIGGER_RESET" == "true" ]; then
            echo "开始清空本地旧证书和账户数据..."
            rm -rf "$CERT_PATH"
            
            echo "正在重置/创建本地 force-reset.txt 标记文件..."
            :> force-reset.txt
          fi
          
          # 确保目标文件夹存在（如果上面删除了，这里会重新创建一个干净的）
          mkdir -p "$CERT_PATH"
          
          # 运行 Lego v5 申请程序
          # --ari-disable：关闭云端 ARI 校验，避免新旧 ACME 账户冲突触发 403 错误
          echo "开始运行 Lego 申请/续签程序..."
          lego run \
            --ari-disable \
            --email="$EMAIL" \
            --domains="$DOMAIN" \
            --path="$CERT_PATH" \
            --dns alidns \
            --accept-tos

      # 4. 检查续签证书文件是否变更
      - name: 检查续签证书文件是否变更
        id: check_changes
        run: |
          CERT_PATH="${{ secrets.CERT_PATH || 'certs' }}"
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add "./$CERT_PATH"
          if ! git diff --cached --quiet; then
            echo "检测到证书变更."
            echo "changed=true" >> $GITHUB_ENV
          else
            echo "未检测到证书变更."
            echo "changed=false" >> $GITHUB_ENV
          fi

      # 5. 安装阿里云 CLI
      - name: 安装阿里云 CLI 为上传证书更新ESA证书做准备
        if: env.changed == 'true'
        run: |
          curl -L https://aliyuncli.alicdn.com/aliyun-cli-linux-latest-amd64.tgz -o aliyun-cli.tgz
          tar -xzf aliyun-cli.tgz
          sudo mv aliyun /usr/local/bin/
          sudo chmod +x /usr/local/bin/aliyun

      # 6. 配置阿里云 CLI
      - name: 配置阿里云 CLI
        if: env.changed == 'true'
        env:
          ALICLOUD_ACCESS_KEY_ID: ${{ secrets.ALICLOUD_ACCESS_KEY_ID }}
          ALICLOUD_ACCESS_KEY_SECRET: ${{ secrets.ALICLOUD_ACCESS_KEY_SECRET }}
          ALIYUN_REGION: ${{ secrets.ALIYUN_REGION }}
        run: |
          REGION="${ALIYUN_REGION:-ap-southeast-1}"
          aliyun configure set --access-key-id "$ALICLOUD_ACCESS_KEY_ID" --access-key-secret "$ALICLOUD_ACCESS_KEY_SECRET" --region "$REGION"

      # 7. 从旧状态文件中获取旧 CertId (仅做记录，调整为后置删除)
      - name: 获取旧 CertId
        if: env.changed == 'true'
        run: |
          if [ -f ssl-certid ]; then
            OLD_CertId=$(grep '"CertId"' ssl-certid | sed -E 's/.*: ([0-9]+).*/\1/')
            if [ -n "$OLD_CertId" ]; then
              echo "OLD_CERT_ID=${OLD_CertId}" >> $GITHUB_ENV
              echo "找到旧证书 ID: $OLD_CertId，将在新证书绑定完成后执行安全删除。"
            else
              echo "ssl-certid 文件中未解析到有效数字 ID。"
            fi
          else
            echo "未找到旧的 ssl-certid 文件，跳过旧证书提取."
          fi

      # 8. 将新证书上传到阿里云并将执行日志写入 ssl-certid 文件
      - name: 将新证书上传到阿里云并将执行日志写入 ssl-certid 文件
        if: env.changed == 'true'
        env:
          CERT_PATH: ${{ secrets.CERT_PATH }}
          NAME: ${{ secrets.NAME }}
        run: |
          CERT_PATH="${CERT_PATH:-certs}"
          NAME="${NAME:-lego-ssl}"
          CURRENT_DATE=$(date +"%Y%m%d")
          NAME="$NAME-$CURRENT_DATE"

          FILENAME=$(ls ./$CERT_PATH/certificates/*.json | head -n 1 | sed 's|.*/||;s|\.json||')
          echo "证书文件名前缀: $FILENAME"
          
          aliyun cas UploadUserCertificate \
            --Cert "$(cat ./$CERT_PATH/certificates/${FILENAME}.crt)" \
            --Key "$(cat ./$CERT_PATH/certificates/${FILENAME}.key)" \
            --Name "$NAME" > ssl-certid
          
          # 解析获取新证书的 ID 用于后续绑定
          NEW_CertId=$(grep '"CertId"' ssl-certid | sed -E 's/.*: ([0-9]+).*/\1/')
          echo "NEW_CERT_ID=${NEW_CertId}" >> $GITHUB_ENV
          echo "新证书上传成功，新 CertId: $NEW_CertId"

      # 9. ESA 绑定新上传的证书 (先升级，防服务中断)
      - name: ESA 绑定新上传的证书
        if: env.changed == 'true' && env.NEW_CERT_ID != ''
        env:
          SITE_ID: ${{ secrets.SITE_ID }}
          NAME: ${{ secrets.NAME }}
          ALIYUN_REGION: ${{ secrets.ALIYUN_REGION }}
        run: |
          REGION="${ALIYUN_REGION:-ap-southeast-1}"
          CertId=${{ env.NEW_CERT_ID }}     
          NAME="${NAME:-lego-ssl}"
          CURRENT_DATE=$(date +"%Y%m%d")
          NAME="$NAME-$CURRENT_DATE"

          site_ids=$(echo "$SITE_ID" | grep -v '^#' | grep -v '^ ' | tr '\n' ',' | sed 's/,$//')
          IFS=',' read -r -a site_ids_array <<< "$site_ids"
          
          echo "正在为以下站点绑定新证书: ${site_ids_array[@]}"
          for site_id in "${site_ids_array[@]}"; do
            echo "正在为站点 ID 执行绑定: $site_id"
            aliyun esa SetCertificate --SiteId "$site_id" --Name "$NAME" --Type cas --CasId "$CertId" --Region "$REGION"
          done

      # 10. 清理旧的 ESA 绑定历史 (保持站点证书历史清洁)
      - name: 清理旧的 ESA 绑定历史
        if: env.changed == 'true'
        env:
          SITE_ID: ${{ secrets.SITE_ID }}
        run: |
          sudo apt-get install -y jq
          site_ids=$(echo "$SITE_ID" | grep -v '^#' | grep -v '^ ' | tr '\n' ',' | sed 's/,$//')
          IFS=',' read -r -a site_ids_array <<< "$site_ids"

          for site_id in "${site_ids_array[@]}"; do
            echo "正在检查站点 ID 的旧证书列表: $site_id"
            while true; do
                response=$(aliyun esa ListCertificates --SiteId "$site_id" --PageSize 1 --PageNumber 1)
                total_count=$(echo "$response" | jq '.TotalCount')

                # 如果 ESA 绑定的证书历史总数大于 2，清理最早的绑定
                if [ "$total_count" -gt 2 ]; then
                  cert_id=$(echo "$response" | jq -r '.Result[0].Id')
                  echo "找到旧的 ESA 证书绑定记录 ID: $cert_id，执行解绑删除。"
                  aliyun esa DeleteCertificate --SiteId "$site_id" --Id "$cert_id"
                else
                  echo "该站点内绑定的证书数量小于或等于 2，无需继续清理."
                  break
                fi
            done
          done

      # 11. 安全删除云端控制台旧数字证书 (在新证书全量生效后执行)
      - name: 安全删除控制台旧数字证书
        if: env.changed == 'true' && env.OLD_CERT_ID != ''
        run: |
          echo "准备从阿里云控制台卸载并删除旧证书，ID: ${{ env.OLD_CERT_ID }}"
          echo "等待 60 秒以确保边缘节点平滑切换到新证书..."
          sleep 60
          if aliyun cas DeleteUserCertificate --CertId "${{ env.OLD_CERT_ID }}"; then
            echo "旧证书删除成功。"
          else
            echo "::warning:: 旧证书删除失败，可能该证书仍被其他云产品关联。建议去控制台手动检查。"
          fi

      # 12. 将续签证书和状态文件提交并推送到 Github
      - name: 将续签证书和状态文件提交并推送到 Github
        if: env.changed == 'true'
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          CERT_PATH="${{ secrets.CERT_PATH || 'certs' }}"
          git add "$CERT_PATH" ssl-certid
          current_time=$(TZ='Asia/Shanghai' date "+%Y-%m-%d %H:%M:%S")
          git commit -m "feat(auto): 证书更新及阿里云ID轮替 - 北京时间: $current_time"
          git push origin main

      # 12.5 检查并同步 force-reset.txt 状态到 GitHub 仓库 (自主变动检测)
      - name: 同步 force-reset.txt 清空状态到 GitHub
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          
          if [ -f "force-reset.txt" ]; then
            git add force-reset.txt
          fi
          
          # Git 自动排查：暂存区中此文件是否有任何变动（无论是新创建还是被清空）
          if ! git diff --staged --quiet; then
            current_time=$(TZ='Asia/Shanghai' date "+%Y-%m-%d %H:%M:%S")
            git commit -m "chore: 自动化重置强制刷新标记文件 - 北京时间: $current_time"
            git push origin main
            echo "检测到标记文件状态变动，已成功同步变动后的状态至 GitHub 仓库。"
          else
            echo "标记文件原本就为空（或未被创建变动），无需同步。"
          fi

      # 13. 读取 SITE_ID 环境变量并写入 site-id 文件
      - name: 读取 SITE_ID 环境变量并写入 site-id 文件
        if: env.changed == 'true'
        env:
          SITE_ID: ${{ secrets.SITE_ID }}
        run: |
          echo "$SITE_ID" > site-id

      # 14. 检查并上传 site-id 到 GitHub
      - name: 检查并上传 site-id 到 GitHub
        if: env.changed == 'true'
        run: |
          set +e
          git diff --exit-code site-id
          if [ $? -ne 0 ]; then
            echo "site-id 文件已更改."
            git add site-id
            current_time=$(TZ='Asia/Shanghai' date "+%Y-%m-%d %H:%M:%S")
            git commit -m "site-id 更新时间 - 北京时间: $current_time"
            git push origin main
          else
            echo "未检测到 site-id 文件变更. 跳过上传."
          fi

      # 15. 读取 DOMAIN 环境变量并写入 domain 文件
      - name: 读取 DOMAIN 环境变量并写入 domain 文件
        if: env.changed == 'true'
        env:
          DOMAIN: ${{ secrets.DOMAIN }}
        run: |
          echo "$DOMAIN" > domain

      # 16. 检查并上传 domain 到 GitHub
      - name: 检查并上传 domain 到 GitHub
        if: env.changed == 'true'
        run: |
          set +e
          git diff --exit-code domain
          if [ $? -ne 0 ]; then
            echo "domain 文件已更改."
            git add domain
            current_time=$(TZ='Asia/Shanghai' date "+%Y-%m-%d %H:%M:%S")
            git commit -m "域名更新时间 - 北京时间: $current_time"
            git push origin main
          else
            echo "未检测到 domain 文件变更. 跳过上传."
          fi
          
      # 17. 写入时间到文件
      - name: 将当前时间写入文件
        run: echo $(date +"%Y-%m-%d %H:%M:%S") > time

      # 18. 提交和推送时间更改
      - name: 提交并推送时间更改
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add time
          current_time=$(TZ='Asia/Shanghai' date "+%Y-%m-%d %H:%M:%S")
          git commit -m "运行时间 - 北京时间: $current_time"
          git push origin main
